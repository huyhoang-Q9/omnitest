[project]
name = "omnitest-ai"
version = "0.1.0"
description = "OmniTest AI: lớp provider độc lập (tắt mặc định), sinh đề xuất test case, phân tích lỗi"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "omnitest-adapters",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitest_ai"]

[tool.uv.sources]
omnitest-adapters = { workspace = true }
