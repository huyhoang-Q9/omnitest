name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnitest
          POSTGRES_PASSWORD: omnitest
          POSTGRES_DB: omnitest_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U omnitest -d omnitest_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Cài Chromium cho test adapter Web
        run: |
          uv run playwright install --with-deps chromium
          echo "OMNITEST_CHROMIUM_EXECUTABLE=$(uv run python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Job này không dùng pnpm: tắt cache tự động theo packageManager (pnpm chưa được cài ở đây).
          package-manager-cache: false
      - name: Cài Appium và driver fake (kiểm chứng giao thức adapter Desktop/Mobile)
        run: |
          mkdir -p "$RUNNER_TEMP/appium" && cd "$RUNNER_TEMP/appium"
          npm init -y >/dev/null && npm i appium@3.8.0
          APPIUM_HOME="$RUNNER_TEMP/appium/home" npx appium driver install --source=npm @appium/fake-driver@6.2.4
          echo "APPIUM_HOME=$RUNNER_TEMP/appium/home" >> "$GITHUB_ENV"
          echo "OMNITEST_APPIUM_BIN=$RUNNER_TEMP/appium/node_modules/.bin/appium" >> "$GITHUB_ENV"
      - name: Build image sandbox script code (kiểm thử cô lập bằng Docker thật)
        run: docker build -f infra/docker/sandbox.Dockerfile -t omnitest-sandbox:latest .
      - run: uv run pytest -q -rs
        env:
          OMNITEST_TEST_DATABASE_URL: postgresql+asyncpg://omnitest:omnitest@127.0.0.1:5432/omnitest_test
      - name: Tài liệu hướng dẫn sử dụng khớp nội dung trang Hướng dẫn
        run: python3 infra/scripts/build_guide.py --check
      - name: Contract OpenAPI không lệch
        run: |
          uv run python infra/scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omnitest/web lint
      - run: pnpm --filter @omnitest/web typecheck
      - run: pnpm --filter @omnitest/web test
      - run: pnpm --filter @omnitest/web exec vite build

  # Build toàn bộ image và chạy thử stack Docker Compose như khi triển khai: suite Smoke qua worker (API + Web
  # bằng Chromium trong container) và một script pytest trong sandbox do worker container khởi chạy.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tạo file env tạm (secret sinh ngẫu nhiên cho lần chạy này, không lưu lại)
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          key = base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("=")
          gid = os.stat("/var/run/docker.sock").st_gid
          with open(".env.ci", "w") as f:
              f.write(f"POSTGRES_PASSWORD={secrets.token_urlsafe(16)}\nOMNITEST_MASTER_KEY={key}\n")
              f.write(f"OMNITEST_COOKIE_SECURE=false\nDOCKER_GID={gid}\n")
          PY
      - run: docker build -f infra/docker/sandbox.Dockerfile -t omnitest-sandbox:latest .
      - name: Build và khởi động stack
        run: docker compose -f infra/docker/compose.yaml -f infra/docker/compose.sandbox.yaml --env-file .env.ci up -d --build
      - name: Smoke test qua nginx
        run: python3 infra/scripts/compose_smoke.py -f infra/docker/compose.yaml -f infra/docker/compose.sandbox.yaml --env-file .env.ci --sandbox
      - name: Log khi lỗi
        if: failure()
        run: docker compose -f infra/docker/compose.yaml -f infra/docker/compose.sandbox.yaml --env-file .env.ci logs --tail 200
      - name: Dọn
        if: always()
        run: docker compose -f infra/docker/compose.yaml -f infra/docker/compose.sandbox.yaml --env-file .env.ci down -v

  # Script khởi động của GitHub Codespaces (.devcontainer/start.sh) chạy được từ đầu: build, tạo tài khoản, dự án demo.
  codespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Chạy script khởi động Codespaces
        run: OMNITEST_COOKIE_SECURE=false bash .devcontainer/start.sh
      - name: Đăng nhập bằng tài khoản script đã tạo, thấy dự án DEMO
        run: |
          python3 - <<'PY'
          import http.cookiejar, json, re, urllib.request
          text = open("omnitest-dang-nhap.txt", encoding="utf-8").read()
          email = re.search(r"Email:\s+(\S+)", text).group(1)
          password = re.search(r"Mật khẩu:\s+(\S+)", text).group(1)
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path, body=None):
              req = urllib.request.Request("http://127.0.0.1:8080" + path, method="POST" if body else "GET",
                  data=json.dumps(body).encode() if body else None,
                  headers={"Content-Type": "application/json", "X-OmniTest-CSRF": "1"})
              return json.loads(op.open(req, timeout=30).read() or b"null")
          call("/api/auth/login", {"email": email, "password": password})
          keys = [p["key"] for p in call("/api/projects?page_size=100")["items"]]
          assert "DEMO" in keys, keys
          print("OK  đăng nhập và thấy dự án DEMO")
          PY
      - name: Chạy lại script (codespace khởi động lại) không lỗi, không tạo trùng
        run: bash .devcontainer/start.sh
      - name: Hai lần chạy cùng lúc không build trùng, cả hai đều báo sẵn sàng
        run: |
          bash .devcontainer/start.sh > a.out 2>&1 & A=$!
          sleep 1
          bash .devcontainer/start.sh > b.out 2>&1
          wait $A
          cat a.out b.out
          grep -q "Đang có lần khởi động khác chạy nền" b.out
          grep -q "(sẵn sàng)" a.out && grep -q "(sẵn sàng)" b.out
      - name: Log khởi động khi lỗi
        if: failure()
        run: tail -n 200 omnitest-khoi-dong.log || true
      - name: Dọn
        if: always()
        run: docker compose -f infra/docker/compose.yaml --env-file .env.codespaces down -v
