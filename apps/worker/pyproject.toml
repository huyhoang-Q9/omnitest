[project]
name = "omnitest-worker"
version = "0.1.0"
description = "OmniTest background worker (Dramatiq): thực thi test run"
requires-python = ">=3.12"
dependencies = [
    "omnitest-api",
    "omnitest-adapters",
    "dramatiq[redis]>=1.17",
]

[tool.uv.sources]
omnitest-api = { workspace = true }
omnitest-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitest_worker"]
