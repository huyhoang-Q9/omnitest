[project]
name = "omnitest-api"
version = "0.1.0"
description = "OmniTest backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "omnitest-adapters",
    "openpyxl>=3.1.5",
    "dramatiq[redis]>=2.2.1",
    "pyyaml>=6.0",
]

[project.scripts]
omnitest-api = "omnitest_api.cli:main"

[tool.uv.sources]
omnitest-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitest_api"]
