[project]
name = "omnitest-adapters"
version = "0.1.0"
description = "OmniTest test adapters: contract chung, API (HTTPX), Web (Playwright), Desktop/Mobile (chưa hỗ trợ)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "jsonpath-ng>=1.7",
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitest_adapters"]
