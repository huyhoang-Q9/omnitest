[project]
name = "omnitest"
version = "0.1.0"
description = "OmniTest Automation Platform (monorepo root)"
requires-python = ">=3.12"
dependencies = ["omnitest-api"]

[tool.uv]
package = false

[tool.uv.sources]
omnitest-api = { workspace = true }

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "E501", "UP046"]  # E501: ruff format lo độ dài code; UP046: giữ Generic cho Pydantic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"apps/api/migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"
packages = ["omnitest_api"]

[tool.ruff.lint.isort]
known-first-party = ["omnitest_api", "tests"]
